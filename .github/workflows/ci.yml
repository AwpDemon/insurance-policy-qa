name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit + integration tests (mock LLM, no network)
        run: pytest -q
      - name: Retrieval eval smoke (BM25 only, full gold set)
        run: python -m evals.run_retrieval --bm25-only --out-dir /tmp/ci-results
      - name: End-to-end eval smoke (mock LLM, 20 questions)
        run: python -m evals.run_generation --mock --retriever bm25 --limit 20 --out-dir /tmp/ci-results
